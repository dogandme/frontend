name: Lighthouse CI

on:
  pull_request:
    branches:
      - dev

permissions:
  pull-requests: write
  contents: write

jobs:
  lhci:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun
        continue-on-error: true

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v3
        with:
          name: lighthouse-report
          path: .lighthouseci

      - name: Read Lighthouse report
        id: read_lighthouse_report
        run: |
          REPORT_PATH=$(find .lighthouseci -name 'lhr-*.json' | head -n 1)
          echo "REPORT_PATH=$REPORT_PATH" >> $GITHUB_ENV
          cat $REPORT_PATH

      - name: Comment PR with Lighthouse report
        uses: thollander/actions-comment-pull-request@v2
        with:
          GITHUB_TOKEN: ${{ secrets.YONGHYEUN_GITHUB_TOKEN }}
          message: |
            ## Lighthouse Report
            Performance: ${{ steps.read_lighthouse_report.outputs.performance }}
            Accessibility: ${{ steps.read_lighthouse_report.outputs.accessibility }}
            Best Practices: ${{ steps.read_lighthouse_report.outputs.best-practices }}
            SEO: ${{ steps.read_lighthouse_report.outputs.seo }}
            PWA: ${{ steps.read_lighthouse_report.outputs.pwa }}
            [View full report](${{ steps.read_lighthouse_report.outputs.report_url }})
